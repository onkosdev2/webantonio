services:
  postgres:
    image: postgres:16-alpine
    container_name: webantonio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: onkos
      POSTGRES_USER: onkos
      POSTGRES_PASSWORD: onkos_local_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - webantonio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onkos -d onkos"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  webantonio_postgres_data:
